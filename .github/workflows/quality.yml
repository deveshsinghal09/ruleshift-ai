name: Quality gate

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: ruleshift_test
          POSTGRES_PASSWORD: ruleshift_test
          POSTGRES_USER: ruleshift_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ruleshift_test -d ruleshift_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      AI_PROVIDER_MODE: fallback
      DATABASE_URL: postgresql://ruleshift_test:ruleshift_test@127.0.0.1:5432/ruleshift_test
      TEST_DATABASE_URL: postgresql://ruleshift_test:ruleshift_test@127.0.0.1:5432/ruleshift_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          cache: npm
          node-version: 20.19.0
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run quality
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          if-no-files-found: ignore
          name: playwright-diagnostics
          path: |
            playwright-report
            test-results
