name: Quality gate

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  cancel-in-progress: true
  group: quality-${{ github.workflow }}-${{ github.ref }}

permissions:
  contents: read

env:
  AI_PROVIDER_MODE: fallback
  DATABASE_URL: postgresql://ruleshift_test:ruleshift_test@127.0.0.1:5432/ruleshift_test
  TEST_DATABASE_URL: postgresql://ruleshift_test:ruleshift_test@127.0.0.1:5432/ruleshift_test

jobs:
  static-and-integration:
    name: Types, lint, tests, and build
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: ruleshift_test
          POSTGRES_PASSWORD: ruleshift_test
          POSTGRES_USER: ruleshift_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ruleshift_test -d ruleshift_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          cache: npm
          node-version: 20.19.0
      - name: Install locked dependencies
        run: npm ci
      - name: Apply isolated test migrations
        run: npm run db:migrate:test
      - name: Check TypeScript
        run: npm run typecheck
      - name: Run ESLint
        run: npm run lint
      - name: Run unit tests
        run: npm run test:unit
      - name: Run component tests
        run: npm run test:components
      - name: Run contract tests
        run: npm run test:contracts
      - name: Run integration tests
        run: npm run test:integration
      - name: Build production bundle
        run: npm run build

  browser:
    name: Production browser flows
    needs: static-and-integration
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: ruleshift_test
          POSTGRES_PASSWORD: ruleshift_test
          POSTGRES_USER: ruleshift_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ruleshift_test -d ruleshift_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          cache: npm
          node-version: 20.19.0
      - name: Install locked dependencies
        run: npm ci
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Run end-to-end tests
        run: npm run test:e2e
      - if: failure()
        name: Upload browser diagnostics
        uses: actions/upload-artifact@v4
        with:
          if-no-files-found: ignore
          name: playwright-diagnostics
          path: |
            playwright-report
            test-results
          retention-days: 7
